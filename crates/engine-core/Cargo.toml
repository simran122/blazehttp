[package]
name = "engine-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Linked by `#[path]` from examples/h1_write_bench.rs and bench/writer/hyper-emul, which cargo-shear does not follow.
[package.metadata.cargo-shear]
ignored-paths = ["tests/support/write_bench.rs"]

[dev-dependencies]
# Counts allocations of the calling thread for the zero-allocation writer test (tests/h1_writer_alloc.rs); its
# global allocator lives in its own test binary. The unsafe code stays inside that crate.
allocation-counter = "=0.8.1"
# Benchmark baseline only (examples/h1_parse_bench.rs); never a dependency of the engine.
httparse = "=1.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
