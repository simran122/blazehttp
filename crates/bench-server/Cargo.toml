[package]
name = "bench-server"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Crates are justified in docs/notes/bench-server.md §3. ring is the TLS provider the Rust competitors use (§16.2).
[dependencies]
flate2 = "1.1.11"
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["time"] }
