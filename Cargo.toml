[workspace]
members = ["crates/*"]
exclude = ["crates/engine-core/fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
deprecated = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
await_holding_refcell_ref = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
