# Rust harness of the cross-language response-head parser bench (bench/parsers/README.md). Its own workspace so the
# competitor (httparse) never enters the engine's dependency graph; never shipped.
[package]
name = "parsers-bench-rust"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
engine-core = { path = "../../../crates/engine-core" }
httparse = "=1.10.1"

[lints.rust]
deprecated = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }

[workspace]

# Design §16.2: Rust competitors use the release profile with fat LTO and one codegen unit.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
